org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 限制网络挂起：连接/读取超时与重试次数，避免卡在不可达的海外仓库
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=2
systemProp.org.gradle.internal.repository.initial.backoff=200
